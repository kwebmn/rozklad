<link rel="stylesheet" href="./../assets/vendor/datepicker/css/datepicker-bs5.min.css" />
<script src="./../assets/vendor/imask/imask.min.js"></script>

<script src="./../assets/vendor/datepicker/js/locale-uk.js"></script>
<script src="./../assets/js/autocomplete.min.js"></script>
<script>
(function () {
	function formatDate(date) {
		var day = date.getDate();
		var month = date.getMonth() + 1;
		var year = date.getFullYear();
		if (day < 10) day = '0' + day;
		if (month < 10) month = '0' + month;
		return [day, month, year].join('.');
	}

	function parseDate(str) {
		var parts = str.split('.');
		return new Date(parts[2], parts[1] - 1, parts[0]);
	}

	var dateMaskOptions = {
		mask: Date,
		pattern: 'd.m.Y',
		blocks: {
			d: { mask: IMask.MaskedRange, from: 1, to: 31, maxLength: 2 },
			m: { mask: IMask.MaskedRange, from: 1, to: 12, maxLength: 2 },
			Y: { mask: IMask.MaskedRange, from: 1900, to: 2999 }
		},
		format: formatDate,
		parse: parseDate
	};

	var sdateEl = document.getElementById('sdate');
	var edateEl = document.getElementById('edate');

	var sdateMask = IMask(sdateEl, dateMaskOptions);
	var edateMask = IMask(edateEl, dateMaskOptions);

	var datepickerOptions = {
		language: 'uk',
		format: 'dd.mm.yyyy',
		autohide: true,
		todayHighlight: true,
		weekStart: 1
	};

	var sdatePicker = new Datepicker(sdateEl, datepickerOptions);
	var edatePicker = new Datepicker(edateEl, datepickerOptions);

	sdateEl.addEventListener('changeDate', function () { sdateMask.updateValue(); });
	edateEl.addEventListener('changeDate', function () { edateMask.updateValue(); });

	var facultyEl = document.getElementById('faculty');
	var courseEl = document.getElementById('course');

	new SimpleAutocomplete(document.getElementById('teacher'), {
		minChars: 3,
		deferMs: 50,
		serviceUrl: './timetable.cgi?n=701&lev=141',
		params: function () {
			return { faculty: facultyEl ? facultyEl.value : '' };
		}
	});

	new SimpleAutocomplete(document.getElementById('group'), {
		minChars: 2,
		deferMs: 50,
		serviceUrl: './timetable.cgi?n=701&lev=142',
		params: function () {
			return {
				faculty: facultyEl ? facultyEl.value : '',
				course: courseEl ? courseEl.value : ''
			};
		}
	});
})();
</script>
